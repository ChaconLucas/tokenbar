name: TokenBar
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
    watchOS: "10.0"

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.4.9"
    CURRENT_PROJECT_VERSION: "30"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    TB_APP_GROUP: $(TB_APP_GROUP_IOS)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  # ── iPhone ────────────────────────────────────────────────────────
  TokenBar:
    type: application
    platform: iOS
    sources: [Shared, App/iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TB_BUNDLE_PREFIX).tokenbar
        PRODUCT_NAME: TokenBar
        INFOPLIST_KEY_CFBundleDisplayName: TokenBar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/iOS/Info.plist
      properties:
        TBAppGroup: $(TB_APP_GROUP)
        NSLocalNetworkUsageDescription: "O TokenBar procura o seu Mac no Wi-Fi para ler os limites direto dele, sem servidor. / TokenBar looks for your Mac on Wi-Fi to read the limits straight from it, no server needed."
        NSBonjourServices: [_tokenbar._tcp]
        NSCameraUsageDescription: "A câmera lê o QR code que o computador mostra, para parear. / The camera reads the QR code shown on the computer, to pair."
        UIBackgroundModes: [fetch]
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers: [tokenbar.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: $(TB_BUNDLE_PREFIX).tokenbar
            CFBundleURLSchemes: [tokenbar]
    entitlements:
      path: App/iOS/TokenBar.entitlements
      properties:
        com.apple.security.application-groups: [$(TB_APP_GROUP_IOS)]
    dependencies:
      - target: TokenBarWidget
      - target: TokenBarWatch

  TokenBarWidget:
    type: app-extension
    platform: iOS
    sources: [Shared, Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TB_BUNDLE_PREFIX).tokenbar.widget
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"   # controles da Central de Controle
        INFOPLIST_KEY_CFBundleDisplayName: TokenBar
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/iOS-Info.plist
      properties:
        TBAppGroup: $(TB_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/iOS.entitlements
      properties:
        com.apple.security.application-groups: [$(TB_APP_GROUP_IOS)]

  # ── Apple Watch ───────────────────────────────────────────────────
  TokenBarWatch:
    type: application
    platform: watchOS
    sources: [Shared, App/watchOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TB_BUNDLE_PREFIX).tokenbar.watchkitapp
        PRODUCT_NAME: TokenBarWatch
        INFOPLIST_KEY_CFBundleDisplayName: TokenBar
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(TB_BUNDLE_PREFIX).tokenbar
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
    info:
      path: App/watchOS/Info.plist
      properties:
        TBAppGroup: $(TB_APP_GROUP)
    entitlements:
      path: App/watchOS/TokenBarWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(TB_APP_GROUP_IOS)]
    dependencies:
      - target: TokenBarWatchWidget

  TokenBarWatchWidget:
    type: app-extension
    platform: watchOS
    sources: [Shared, Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TB_BUNDLE_PREFIX).tokenbar.watchkitapp.widget
        INFOPLIST_KEY_CFBundleDisplayName: TokenBar
    info:
      path: Widget/watchOS-Info.plist
      properties:
        TBAppGroup: $(TB_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/watchOS.entitlements
      properties:
        com.apple.security.application-groups: [$(TB_APP_GROUP_IOS)]

  # ── Mac ───────────────────────────────────────────────────────────
  # Sem sandbox: precisa ler ~/.codex e ~/.tokenbar (por isso fica fora da Mac App Store).
  TokenBarMac:
    type: application
    platform: macOS
    sources: [Shared, App/macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TB_BUNDLE_PREFIX).tokenbar.mac
        PRODUCT_NAME: TokenBar
        INFOPLIST_KEY_CFBundleDisplayName: TokenBar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        TB_APP_GROUP: $(TB_APP_GROUP_MAC)
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/macOS/Info.plist
      properties:
        TBAppGroup: $(TB_APP_GROUP)
    entitlements:
      path: App/macOS/TokenBarMac.entitlements
      properties:
        com.apple.security.application-groups: [$(TB_APP_GROUP_MAC)]
        com.apple.security.network.client: true
    dependencies:
      - target: TokenBarMacWidget

  TokenBarMacWidget:
    type: app-extension
    platform: macOS
    sources: [Shared, Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TB_BUNDLE_PREFIX).tokenbar.mac.widget
        MACOSX_DEPLOYMENT_TARGET: "26.0"     # controles da Central de Controle
        TB_APP_GROUP: $(TB_APP_GROUP_MAC)
        INFOPLIST_KEY_CFBundleDisplayName: TokenBar
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Widget/macOS-Info.plist
      properties:
        TBAppGroup: $(TB_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TB_APP_GROUP_MAC)]
